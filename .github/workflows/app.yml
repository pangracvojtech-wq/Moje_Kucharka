name: App

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/app.yml"
  workflow_dispatch:

jobs:
  build:
    name: Typecheck and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lockfile is committed yet; switch to `npm ci` once package-lock.json exists.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: ci-placeholder
