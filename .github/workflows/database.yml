name: Database

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

jobs:
  test:
    name: Migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned version: resolving "latest" hits the GitHub API rate limit.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Start local database and apply migrations
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --level error --fail-on error

      - name: Run pgTAP tests
        run: supabase test db
